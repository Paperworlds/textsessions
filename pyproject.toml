[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "textsessions"
version = "0.1.8"
description = "A Textual TUI for managing Claude Code sessions"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "textual>=0.70",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
]

[project.scripts]
textsessions = "textsessions.cli:main"
claude-sessions-index = "textsessions.cli:sessions_index_compat"

[tool.hatch.build.targets.wheel]
packages = ["src/textsessions"]
